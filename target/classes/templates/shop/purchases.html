<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Orders')}"></head>
<body>
<div id="overlay" class="overlay"></div>
<div class="d-flex">
  <div th:replace="~{fragments/layout :: sidebar('purchases')}"></div>
  <div class="main-wrapper">
    <div th:replace="~{fragments/layout :: topbar('Orders', 'Tool purchase orders')}"></div>
    <div class="page-content">

      <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
      <div class="alert alert-error"   th:if="${error}"   th:text="${error}"></div>

      <!-- Staff stats -->
      <div th:if="${currentUser.staff}"
           style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px;">
        <div class="stat-card">
          <div class="stat-icon">⏳</div>
          <div class="stat-value" th:text="${pendingCount}"></div>
          <div class="stat-label">Pending Orders</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">✅</div>
          <div class="stat-value" th:text="${confirmedCount}"></div>
          <div class="stat-label">Confirmed Orders</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">📦</div>
          <div class="stat-value" th:text="${purchases.size()}"></div>
          <div class="stat-label">Total Orders</div>
        </div>
      </div>

      <div class="page-header">
        <div class="page-header-text">
          <h1 th:text="${currentUser.staff} ? '📦 All Orders' : '📦 My Orders'"></h1>
        </div>
        <a th:href="@{/shop}" class="btn btn-primary">🛒 Shop More Tools</a>
      </div>

      <div class="card">
        <div class="card-body" style="padding:0;">
          <div class="empty-state" th:if="${purchases.empty}" style="padding:48px;">
            <div class="empty-icon">🛒</div>
            <h3>No Orders Yet</h3>
            <p><a th:href="@{/shop}">Browse the Tool Shop →</a></p>
          </div>

          <table class="table" th:if="${!purchases.empty}">
            <thead>
              <tr>
                <th>#</th>
                <th>Tool</th>
                <th th:if="${currentUser.staff}">Customer</th>
                <th>Qty</th>
                <th>Unit Price</th>
                <th>Total</th>
                <th>Delivery Address</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="p : ${purchases}">
                <td th:text="${p.id}"></td>
                <td>
                  <div style="display:flex;align-items:center;gap:8px;">
                    <img th:if="${p.itemImageUrl != null and !#strings.isEmpty(p.itemImageUrl)}"
                         th:src="${p.itemImageUrl}" style="width:36px;height:36px;object-fit:cover;border-radius:6px;"/>
                    <span th:if="${p.itemImageUrl == null or #strings.isEmpty(p.itemImageUrl)}"
                          style="font-size:22px;">🔧</span>
                    <span th:text="${p.itemName}"></span>
                  </div>
                </td>
                <td th:if="${currentUser.staff}" th:text="${p.customerName}"></td>
                <td th:text="${p.quantity}"></td>
                <td th:text="'₱' + ${#numbers.formatDecimal(p.unitPrice,0,'COMMA',0,'POINT')}"></td>
                <td class="fw-bold" th:text="'₱' + ${#numbers.formatDecimal(p.totalAmount,0,'COMMA',0,'POINT')}"></td>
                <td th:text="${p.deliveryAddress}"></td>
                <td>
                  <span class="badge" th:classappend="${p.statusBadgeClass}" th:text="${p.status}"></span>
                </td>
                <td>
                  <!-- Staff: confirm pending -->
                  <div th:if="${currentUser.staff and p.status == 'PENDING'}"
                       style="display:flex;flex-direction:column;gap:6px;">
                    <button class="btn btn-primary" style="font-size:11px;padding:4px 10px;"
                            onclick="openConfirm(this)"
                            th:data-id="${p.id}">✅ Confirm</button>
                    <form th:action="@{/purchases/{id}/cancel(id=${p.id})}" method="post">
                      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                      <button type="submit" class="btn btn-secondary"
                              style="font-size:11px;padding:4px 10px;width:100%;"
                              onclick="return confirm('Cancel order?')">✖ Cancel</button>
                    </form>
                  </div>
                  <!-- Customer: cancel pending own order -->
                  <form th:if="${!currentUser.staff and p.status == 'PENDING'}"
                        th:action="@{/purchases/{id}/cancel(id=${p.id})}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-secondary"
                            style="font-size:11px;padding:4px 10px;"
                            onclick="return confirm('Cancel this order?')">Cancel</button>
                  </form>
                  <span th:if="${p.status != 'PENDING'}" style="font-size:12px;color:var(--text-muted);">
                    <a th:if="${p.status == 'CONFIRMED'}"
                       th:href="@{/purchases/{id}/receipt(id=${p.id})}"
                       style="font-size:12px;">🧾 Receipt</a>
                    <span th:if="${p.status == 'CANCELLED'}">—</span>
                  </span>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- Confirm Modal -->
<div id="confirmModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center;">
  <div style="background:var(--surface);border-radius:12px;padding:28px;width:380px;max-width:95vw;">
    <h3 style="margin-bottom:16px;">✅ Confirm Order</h3>
    <form id="confirmForm" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <div class="form-group">
        <label class="form-label">Payment Method</label>
        <select name="paymentMethod" class="form-control" required>
          <option value="">Select...</option>
          <option value="CASH">Cash</option>
          <option value="GCASH">GCash</option>
          <option value="BANK_TRANSFER">Bank Transfer</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Reference No.</label>
        <input type="text" name="referenceNo" class="form-control" placeholder="Optional"/>
      </div>
      <div class="form-group">
        <label class="form-label">Payment Date</label>
        <input type="date" name="paymentDate" class="form-control"/>
      </div>
      <div class="d-flex gap-2" style="margin-top:16px;">
        <button type="submit" class="btn btn-primary">Confirm Order</button>
        <button type="button" class="btn btn-secondary" onclick="closeConfirm()">Cancel</button>
      </div>
    </form>
  </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
<script>
function openConfirm(btn) {
  var id = btn.getAttribute('data-id');
  document.getElementById('confirmForm').action = '/purchases/' + id + '/confirm';
  var modal = document.getElementById('confirmModal');
  modal.style.display = 'flex';
}
function closeConfirm() {
  document.getElementById('confirmModal').style.display = 'none';
}
</script>
</body>
</html>
