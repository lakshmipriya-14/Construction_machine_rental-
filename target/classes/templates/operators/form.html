<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Add Operator')}"></head>
<body>
<div id="overlay" class="overlay"></div>
<div class="d-flex">
  <div th:replace="~{fragments/layout :: sidebar('operators')}"></div>
  <div class="main-wrapper">
    <div th:replace="~{fragments/layout :: topbar('Add Operator', 'Register a new machine operator')}"></div>
    <div class="page-content">
      <div class="alert alert-error" th:if="${error}" th:text="${error}" data-autohide="true"></div>

      <div class="page-header">
        <div class="page-header-text"><h1>Add New Operator</h1></div>
        <a th:href="@{/operators}" class="btn btn-secondary">← Back</a>
      </div>

      <div class="card" style="max-width:640px;">
        <div class="card-body">
          <form action="/operators/new" method="post">
            <div class="form-grid">
              <div class="form-group">
                <label class="form-label">Full Name *</label>
                <input type="text" name="name" class="form-control" placeholder="Operator's full name" required/>
              </div>
              <div class="form-group">
                <label class="form-label">Specialization *</label>
                <input type="text" name="specialization" class="form-control"
                       placeholder="e.g. EXCAVATOR, BULLDOZER, CRANE" required/>
              </div>
              <div class="form-group">
                <label class="form-label">Daily Rate (PHP) *</label>
                <input type="number" name="dailyRate" class="form-control" step="0.01" min="0" required/>
              </div>
              <div class="form-group">
                <label class="form-label">Username (for login) *</label>
                <input type="text" name="username" class="form-control" placeholder="Login username" required/>
              </div>
              <div class="form-group">
                <label class="form-label">Password *</label>
                <input type="password" name="password" class="form-control" placeholder="Min 6 characters" required/>
              </div>
              <div class="form-group">
                <label class="form-label">Contact</label>
                <input type="text" name="contact" class="form-control" placeholder="09XXXXXXXXX"/>
              </div>
              <div class="form-group form-full">
                <label class="form-label">Address</label>
                <input type="text" name="address" class="form-control" placeholder="Residential address"/>
              </div>
            </div>
            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary btn-lg">➕ Add Operator</button>
              <a th:href="@{/operators}" class="btn btn-secondary btn-lg">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
