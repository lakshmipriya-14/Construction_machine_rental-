<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Add User')}"></head>
<body>
<div id="overlay" class="overlay"></div>
<div class="d-flex">
  <div th:replace="~{fragments/layout :: sidebar('users')}"></div>
  <div class="main-wrapper">
    <div th:replace="~{fragments/layout :: topbar('Add User', 'Create a new system account')}"></div>
    <div class="page-content">
      <div class="alert alert-error" th:if="${error}" th:text="${error}" data-autohide="true"></div>

      <div class="page-header">
        <div class="page-header-text"><h1>Add New User</h1></div>
        <a th:href="@{/users}" class="btn btn-secondary">← Back</a>
      </div>

      <div class="card" style="max-width:640px;">
        <div class="card-body">
          <form action="/users/new" method="post">
            <div class="form-grid">
              <div class="form-group">
                <label class="form-label">Full Name *</label>
                <input type="text" name="fullName" class="form-control" placeholder="e.g. Maria Santos" required/>
              </div>
              <div class="form-group">
                <label class="form-label">Role *</label>
                <select name="role" class="form-control" required>
                  <option value="">Select role</option>
                  <option value="CUSTOMER">👥 Customer</option>
                  <option value="MANAGER">🏢 Manager</option>
                  <option value="OPERATOR">👷 Operator</option>
                  <option value="DRIVER">🚛 Driver</option>
                  <option value="OWNER" th:if="${currentUser.owner}">👑 Owner</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">Username *</label>
                <input type="text" name="username" class="form-control" placeholder="Login username" required/>
              </div>
              <div class="form-group">
                <label class="form-label">Password *</label>
                <input type="password" name="password" class="form-control" placeholder="Min 6 characters" required/>
              </div>
              <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" placeholder="user@email.com"/>
              </div>
              <div class="form-group">
                <label class="form-label">Contact Number</label>
                <input type="text" name="contact" class="form-control" placeholder="09XXXXXXXXX"/>
              </div>
              <div class="form-group form-full">
                <label class="form-label">Address</label>
                <input type="text" name="address" class="form-control" placeholder="Full address"/>
              </div>
            </div>
            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary btn-lg">➕ Create User</button>
              <a th:href="@{/users}" class="btn btn-secondary btn-lg">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
