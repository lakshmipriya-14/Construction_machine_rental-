<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Users')}"></head>
<body>
<div id="overlay" class="overlay"></div>
<div class="d-flex">
  <div th:replace="~{fragments/layout :: sidebar('users')}"></div>
  <div class="main-wrapper">
    <div th:replace="~{fragments/layout :: topbar('Users', 'Manage system accounts')}"></div>
    <div class="page-content">
      <div class="alert alert-success" th:if="${success}" th:text="${success}" data-autohide="true"></div>
      <div class="alert alert-error"   th:if="${error}"   th:text="${error}"   data-autohide="true"></div>

      <div class="page-header">
        <div class="page-header-text">
          <h1>User Accounts</h1>
          <p th:text="${users.size()} + ' accounts found'"></p>
        </div>
        <a th:href="@{/users/new}" class="btn btn-primary">➕ Add User</a>
      </div>

      <!-- Role Filters -->
      <div class="filters-bar">
        <a th:href="@{/users}" class="filter-btn" th:classappend="${selectedRole == null} ? 'active' : ''">All</a>
        <a th:href="@{/users(role='CUSTOMER')}" class="filter-btn" th:classappend="${selectedRole == 'CUSTOMER'} ? 'active' : ''">👥 Customers</a>
        <a th:href="@{/users(role='MANAGER')}"  class="filter-btn" th:classappend="${selectedRole == 'MANAGER'} ? 'active' : ''">🏢 Managers</a>
        <a th:href="@{/users(role='OPERATOR')}" class="filter-btn" th:classappend="${selectedRole == 'OPERATOR'} ? 'active' : ''">👷 Operators</a>
        <a th:href="@{/users(role='DRIVER')}"   class="filter-btn" th:classappend="${selectedRole == 'DRIVER'} ? 'active' : ''">🚛 Drivers</a>
        <a th:href="@{/users(role='OWNER')}"    class="filter-btn" th:classappend="${selectedRole == 'OWNER'} ? 'active' : ''">👑 Owners</a>
      </div>

      <div class="card">
        <div th:if="${users.empty}" class="empty-state">
          <div class="empty-icon">👥</div>
          <h3>No Users Found</h3>
        </div>
        <div class="table-wrapper" th:if="${!users.empty}">
          <table>
            <thead>
              <tr>
                <th>#</th><th>Name</th><th>Username</th><th>Role</th>
                <th>Email</th><th>Contact</th><th>Status</th>
                <th th:if="${currentUser.staff}">Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="u : ${users}">
                <td class="text-muted fs-sm" th:text="${u.id}"></td>
                <td class="fw-bold" th:text="${u.fullName}"></td>
                <td class="text-muted" th:text="${u.username}"></td>
                <td>
                  <span class="badge badge-primary"   th:if="${u.owner}">OWNER</span>
                  <span class="badge badge-info"      th:if="${u.manager}">MANAGER</span>
                  <span class="badge badge-success"   th:if="${u.customer}">CUSTOMER</span>
                  <span class="badge badge-warning"   th:if="${u.operator}">OPERATOR</span>
                  <span class="badge badge-secondary" th:if="${u.driver}">DRIVER</span>
                </td>
                <td class="text-muted fs-sm" th:text="${u.email}"></td>
                <td class="fs-sm" th:text="${u.contact}"></td>
                <td>
                  <span class="badge badge-success"   th:if="${u.active}">Active</span>
                  <span class="badge badge-secondary" th:if="${!u.active}">Inactive</span>
                </td>
                <td>
                  <div class="d-flex gap-1" style="flex-wrap:wrap;">
                    <!-- Edit: both admin and manager can edit -->
                    <a th:if="${currentUser.staff}"
                       th:href="@{/users/{id}/edit(id=${u.id})}"
                       class="btn btn-secondary btn-sm">Edit</a>
                    <!-- Deactivate/Activate: ADMIN only -->
                    <form th:if="${currentUser.owner}"
                          th:action="@{/users/{id}/toggle(id=${u.id})}" method="post" style="display:inline;">
                      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                      <button type="submit" class="btn btn-sm"
                              th:classappend="${u.active} ? 'btn-warning' : 'btn-success'"
                              th:text="${u.active} ? '🔒 Deactivate' : '🔓 Activate'"
                              onclick="return confirm('Change this user\'s status?')"></button>
                    </form>
                    <!-- Delete: ADMIN only -->
                    <form th:if="${currentUser.owner and !u.owner}"
                          th:action="@{/users/{id}/delete(id=${u.id})}" method="post" style="display:inline;">
                      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                      <button type="submit" class="btn btn-danger btn-sm"
                              onclick="return confirm('Permanently delete this user? This cannot be undone.')">🗑️ Delete</button>
                    </form>
                  </div>
                  <!-- Role restriction notice for manager -->
                  <div th:if="${currentUser.manager and !currentUser.owner}"
                       style="font-size:11px;color:var(--text-muted);margin-top:4px;">
                    Deactivate/Delete: Admin only
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
