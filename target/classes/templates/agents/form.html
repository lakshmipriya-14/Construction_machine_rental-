<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Add Driver')}"></head>
<body>
<div id="overlay" class="overlay"></div>
<div class="d-flex">
  <div th:replace="~{fragments/layout :: sidebar('agents')}"></div>
  <div class="main-wrapper">
    <div th:replace="~{fragments/layout :: topbar('Add Delivery Agent', 'Register a new driver')}"></div>
    <div class="page-content">
      <div class="alert alert-error" th:if="${error}" th:text="${error}" data-autohide="true"></div>

      <div class="page-header">
        <div class="page-header-text"><h1>Add Delivery Agent</h1></div>
        <a th:href="@{/agents}" class="btn btn-secondary">← Back</a>
      </div>

      <div class="card" style="max-width:640px;">
        <div class="card-body">
          <form action="/agents/new" method="post">
            <div class="form-grid">
              <div class="form-group">
                <label class="form-label">Full Name *</label>
                <input type="text" name="name" class="form-control" placeholder="Driver's full name" required/>
              </div>
              <div class="form-group">
                <label class="form-label">Vehicle Type *</label>
                <select name="vehicleType" class="form-control" required>
                  <option value="">Select vehicle</option>
                  <option value="FLATBED">Flatbed Truck</option>
                  <option value="TRUCK">Delivery Truck</option>
                  <option value="PICKUP">Pickup Truck</option>
                  <option value="VAN">Van</option>
                  <option value="LOWBOY">Lowboy Trailer</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">License Number *</label>
                <input type="text" name="licenseNo" class="form-control" placeholder="e.g. ABC-1234" required/>
              </div>
              <div class="form-group">
                <label class="form-label">Daily Rate (PHP) *</label>
                <input type="number" name="dailyRate" class="form-control" step="0.01" min="0" required/>
              </div>
              <div class="form-group">
                <label class="form-label">Username (for login) *</label>
                <input type="text" name="username" class="form-control" required/>
              </div>
              <div class="form-group">
                <label class="form-label">Password *</label>
                <input type="password" name="password" class="form-control" required/>
              </div>
              <div class="form-group">
                <label class="form-label">Contact</label>
                <input type="text" name="contact" class="form-control" placeholder="09XXXXXXXXX"/>
              </div>
              <div class="form-group">
                <label class="form-label">Address</label>
                <input type="text" name="address" class="form-control"/>
              </div>
            </div>
            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary btn-lg">➕ Add Driver</button>
              <a th:href="@{/agents}" class="btn btn-secondary btn-lg">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
