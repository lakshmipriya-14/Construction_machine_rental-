<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Delivery Agents')}"></head>
<body>
<div id="overlay" class="overlay"></div>
<div class="d-flex">
  <div th:replace="~{fragments/layout :: sidebar('agents')}"></div>
  <div class="main-wrapper">
    <div th:replace="~{fragments/layout :: topbar('Delivery Agents', 'Manage drivers and deliveries')}"></div>
    <div class="page-content">
      <div class="alert alert-success" th:if="${success}" th:text="${success}" data-autohide="true"></div>
      <div class="alert alert-error"   th:if="${error}"   th:text="${error}"   data-autohide="true"></div>

      <div class="page-header">
        <div class="page-header-text">
          <h1>Delivery Agents</h1>
          <p th:text="${agents.size()} + ' drivers registered'"></p>
        </div>
        <a th:href="@{/agents/new}" class="btn btn-primary">➕ Add Driver</a>
      </div>

      <div class="card">
        <div th:if="${agents.empty}" class="empty-state">
          <div class="empty-icon">🚛</div>
          <h3>No Delivery Agents Yet</h3>
          <p>Add your first driver to enable deliveries.</p>
        </div>
        <div class="table-wrapper" th:if="${!agents.empty}">
          <table>
            <thead>
              <tr>
                <th>#</th><th>Name</th><th>Vehicle</th><th>License No</th>
                <th>Daily Rate</th><th>Status</th><th>Current Job</th><th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="ag : ${agents}">
                <td class="text-muted fs-sm" th:text="${ag.id}"></td>
                <td class="fw-bold" th:text="${ag.name}"></td>
                <td><span class="badge badge-secondary" th:text="${ag.vehicleType}"></span></td>
                <td class="text-muted fs-sm" th:text="${ag.licenseNo}"></td>
                <td>
                  <span class="fw-bold text-primary"
                        th:text="'₱' + ${#numbers.formatDecimal(ag.dailyRate,0,'COMMA',0,'POINT')}"></span>
                  <small class="text-muted">/day</small>
                </td>
                <td>
                  <span class="badge" th:classappend="${ag.workStatusBadgeClass}" th:text="${ag.workStatus}"></span>
                </td>
                <td class="fs-sm">
                  <span th:if="${ag.assignedRentalId > 0}" th:text="'Rental #' + ${ag.assignedRentalId}"></span>
                  <span th:if="${ag.assignedRentalId <= 0}" class="text-muted">—</span>
                </td>
                <td>
                  <form th:action="@{/agents/{id}/toggle-availability(id=${ag.id})}" method="post" style="display:inline;">
                    <button type="submit" class="btn btn-sm"
                            th:classappend="${ag.available} ? 'btn-warning' : 'btn-success'"
                            th:text="${ag.available} ? 'Set Unavailable' : 'Set Available'"
                            th:attr="disabled=${ag.workStatus == 'ON_DELIVERY' || ag.workStatus == 'DELIVERED' ? 'disabled' : null}"></button>
                  </form>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
