<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My Dashboard')}"></head>
<body>
<div id="overlay" class="overlay"></div>
<div class="d-flex">
  <div th:replace="~{fragments/layout :: sidebar('dashboard')}"></div>
  <div class="main-wrapper">
    <div th:replace="~{fragments/layout :: topbar('My Dashboard', 'Your rentals and orders')}"></div>
    <div class="page-content">

      <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
      <div class="alert alert-error"   th:if="${error}"   th:text="${error}"></div>

      <!-- Welcome + quick stats -->
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:24px;">
        <div class="stat-card">
          <div class="stat-icon">📋</div>
          <div class="stat-value" th:text="${myRentals.size()}"></div>
          <div class="stat-label">Total Rentals</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">✅</div>
          <div class="stat-value" th:text="${activeRentals}"></div>
          <div class="stat-label">Active Rentals</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">🛒</div>
          <div class="stat-value" th:text="${myPurchases.size()}"></div>
          <div class="stat-label">Total Orders</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">⏳</div>
          <div class="stat-value" th:text="${pendingPurchases}"></div>
          <div class="stat-label">Pending Orders</div>
        </div>
      </div>

      <!-- Quick actions -->
      <div style="display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap;">
        <a th:href="@{/shop}" class="btn btn-primary">🛒 Browse Tool Shop</a>
        <a th:href="@{/rentals/new}" class="btn btn-secondary">📋 New Rental</a>
        <a th:href="@{/purchases}" class="btn btn-secondary">📦 All My Orders</a>
      </div>

      <!-- My Rentals -->
      <div class="card" style="margin-bottom:24px;">
        <div class="card-header" style="display:flex;justify-content:space-between;align-items:center;">
          <h3>📋 My Rentals</h3>
          <a th:href="@{/rentals}" class="btn btn-secondary" style="font-size:12px;padding:4px 12px;">View All</a>
        </div>
        <div class="card-body" style="padding:0;">
          <div class="empty-state" th:if="${myRentals.empty}" style="padding:32px;">
            <div class="empty-icon">📋</div>
            <p>No rentals yet. <a th:href="@{/rentals/new}">Start your first rental →</a></p>
          </div>
          <table class="table" th:if="${!myRentals.empty}">
            <thead>
              <tr>
                <th>#</th>
                <th>Equipment</th>
                <th>Dates</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="r : ${myRentals}" th:style="${r.activeRental} ? 'background:var(--bg-highlight,#f0f9ff)' : ''">
                <td th:text="${r.id}"></td>
                <td th:text="${r.itemName}"></td>
                <td th:text="${r.startDate} + ' → ' + ${r.endDate}"></td>
                <td><span class="badge" th:classappend="${r.statusBadgeClass}" th:text="${r.status}"></span></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- My Purchases -->
      <div class="card">
        <div class="card-header" style="display:flex;justify-content:space-between;align-items:center;">
          <h3>🛒 My Orders</h3>
          <a th:href="@{/purchases}" class="btn btn-secondary" style="font-size:12px;padding:4px 12px;">View All</a>
        </div>
        <div class="card-body" style="padding:0;">
          <div class="empty-state" th:if="${myPurchases.empty}" style="padding:32px;">
            <div class="empty-icon">🛒</div>
            <p>No orders yet. <a th:href="@{/shop}">Browse the tool shop →</a></p>
          </div>
          <table class="table" th:if="${!myPurchases.empty}">
            <thead>
              <tr>
                <th>#</th>
                <th>Tool</th>
                <th>Qty</th>
                <th>Total</th>
                <th>Status</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="p : ${myPurchases}">
                <td th:text="${p.id}"></td>
                <td>
                  <div style="display:flex;align-items:center;gap:8px;">
                    <img th:if="${p.itemImageUrl != null and !#strings.isEmpty(p.itemImageUrl)}"
                         th:src="${p.itemImageUrl}" style="width:32px;height:32px;object-fit:cover;border-radius:4px;"/>
                    <span th:text="${p.itemName}"></span>
                  </div>
                </td>
                <td th:text="${p.quantity}"></td>
                <td th:text="'₱' + ${#numbers.formatDecimal(p.totalAmount,0,'COMMA',0,'POINT')}"></td>
                <td><span class="badge" th:classappend="${p.statusBadgeClass}" th:text="${p.status}"></span></td>
                <td>
                  <form th:if="${p.status == 'PENDING'}"
                        th:action="@{/purchases/{id}/cancel(id=${p.id})}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-secondary"
                            style="font-size:11px;padding:3px 10px;"
                            onclick="return confirm('Cancel this order?')">Cancel</button>
                  </form>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
